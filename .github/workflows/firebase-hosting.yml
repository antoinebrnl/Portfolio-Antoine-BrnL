name: Publier le portfolio sur Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    # Configure these repository variables after the first Google connection.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Connexion Google sans clé privée permanente
        uses: google-github-actions/auth@v3
        with:
          project_id: project-c3bfb111-69c7-4d37-9c0
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Vérifier, construire et publier
        run: pnpm run publier --non-interactive
